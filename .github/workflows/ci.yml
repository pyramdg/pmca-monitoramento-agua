name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check formatting
        run: python -m black --check . --exclude "\.venv|__pycache__"
      - name: Lint
        run: python -m flake8 . --exclude=.venv,__pycache__ --max-line-length=88
      - name: Test
        run: python -m pytest -q
